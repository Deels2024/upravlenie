name: Deploy recovery v3 clean

on:
  push:
    branches:
      - recovery/v3-clean
  workflow_dispatch:

concurrency:
  group: upravlenie-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test

      - name: Prepare release archive
        run: tar --exclude=.git --exclude=.github -czf /tmp/upravlenie-release.tar.gz .

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          timeout 20 ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" /tmp/upravlenie-release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/upravlenie-release.tar.gz"

      - name: Build and switch service
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE' | tee /tmp/upravlenie-deploy-result.log
          set -euo pipefail
          staging="$(mktemp -d /opt/upravlenie-release.XXXXXX)"
          trap 'rm -rf -- "$staging"' EXIT
          tar -xzf /tmp/upravlenie-release.tar.gz -C "$staging"
          bash "$staging/scripts/deploy-production.sh" "$staging" </dev/null
          rm -f /tmp/upravlenie-release.tar.gz
          REMOTE
          grep -qx RELEASE_VERIFIED /tmp/upravlenie-deploy-result.log

