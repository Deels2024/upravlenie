name: Owner Property CI
on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check installer syntax
        run: |
          bash -n ./install.sh
          bash -n ./install-v2.4.sh
          bash -n ./install-v2.5.sh
          bash -n ./install-v2.6.sh
          bash -n ./ops/setup-self-hosted-runner.sh
      - name: Verify production release modules
        env:
          VERIFY_ONLY: '1'
        run: bash ./install.sh
      - name: Check frontend and backend modules
        run: |
          node --check overlays/v2.4/field-tools.js
          node --check overlays/v2.4/v24-media.js
          node --check overlays/v2.4/v24-offline.js
          node --check overlays/v2.4/v24-followups.js
          node --check overlays/v2.4/v24-notifications.js
          node --check overlays/v2.5/production-clean-start.js
          node --check overlays/v2.6/pwa-mobile.js
          node --check overlays/v2.6/sw.js
          grep -q 'productionCleanStartAt' overlays/v2.5/production-clean-start.js
          grep -q '"display":"standalone"' overlays/v2.6/manifest.webmanifest
          grep -q 'owner-property-shell-v26-mobile' overlays/v2.6/sw.js
          grep -q 'pwaMore' overlays/v2.6/pwa-mobile.js
          grep -q 'upravlenie-prod' .github/workflows/deploy.yml
