name: Owner Property CI
on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check installer syntax
        run: |
          bash -n ./install.sh
          bash -n ./install-v2.4.sh
          bash -n ./install-v2.5.sh
      - name: Verify production release modules
        env:
          VERIFY_ONLY: '1'
        run: bash ./install.sh
      - name: Check frontend and backend modules
        run: |
          node --check overlays/v2.4/field-tools.js
          node --check overlays/v2.4/v24-media.js
          node --check overlays/v2.4/v24-offline.js
          node --check overlays/v2.4/v24-followups.js
          node --check overlays/v2.4/v24-notifications.js
          node --check overlays/v2.5/production-clean-start.js
          grep -q 'productionCleanStartAt' overlays/v2.5/production-clean-start.js
          grep -q 'state-before-cleanup.json' overlays/v2.5/production-clean-start.js
