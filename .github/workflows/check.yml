name: Application checks

on:
  pull_request:
    branches: [recovery/v3-clean]
  push:
    branches: ['codex/uk-audit-*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
