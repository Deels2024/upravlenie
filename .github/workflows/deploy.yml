name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-upravlenie
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, upravlenie-prod]
    timeout-minutes: 20
    steps:
      - name: Deploy Owner Property v2.6 locally
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/deploy-upravlenie

      - name: Verify local endpoint
        id: verify_local
        if: steps.deploy.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --silent --show-error --fail --max-time 15 http://127.0.0.1:8787/healthz)"
          printf '%s' "$body" | grep -q '"version":"2.6.0"'
          printf 'Local deployment is healthy: %s\n' "$body"

      - name: Verify public endpoint
        id: verify_public
        if: steps.deploy.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --silent --show-error --fail --max-time 15 http://5.183.191.139:8787/healthz)"
          printf '%s' "$body" | grep -q '"version":"2.6.0"'
          printf 'Public deployment is healthy: %s\n' "$body"

      - name: Report deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          LOCAL_OUTCOME: ${{ steps.verify_local.outcome }}
          PUBLIC_OUTCOME: ${{ steps.verify_public.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          ## Production deployment status

          - Commit: ${GITHUB_SHA}
          - Runner: self-hosted / upravlenie-prod
          - Deploy on server: **${DEPLOY_OUTCOME}**
          - Local healthcheck: **${LOCAL_OUTCOME}**
          - Public healthcheck: **${PUBLIC_OUTCOME}**
          - Expected version: 2.6.0
          - Target: 5.183.191.139:8787
          - Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/1" -f body="$body" >/dev/null
