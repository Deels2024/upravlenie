services:
  app:
    image: upravlenie-v3-app:local
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8787
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      BACKUP_DIR: /app/backups
      UPLOAD_DIR: /app/private_uploads
    ports:
      - "8787:8787"
    volumes:
      - property-owner_app_data:/app/data
      - property-owner_app_uploads:/app/private_uploads
      - backups:/app/backups:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
  backup:
    image: upravlenie-v3-app:local
    restart: unless-stopped
    command: ["node", "--no-warnings", "scripts/backup.js"]
    environment:
      DB_FILE: /app/data/app.db
      UPLOAD_DIR: /app/private_uploads
      BACKUP_DIR: /app/backups
      BACKUP_INTERVAL_SECONDS: "86400"
      BACKUP_KEEP: "14"
    volumes:
      - property-owner_app_data:/app/data:ro
      - property-owner_app_uploads:/app/private_uploads:ro
      - backups:/app/backups
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
volumes:
  backups:
    name: upravlenie_backups
  property-owner_app_data:
    external: true
  property-owner_app_uploads:
    external: true
