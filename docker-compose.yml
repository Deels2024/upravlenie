services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      OWNER_LOGIN: ${OWNER_LOGIN:-owner}
      OWNER_PASSWORD: ${OWNER_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      DB_FILE: /app/data/app.db
    volumes:
      - app_data:/app/data
      - app_uploads:/app/private_uploads
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8787:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  backup:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node","--no-warnings","scripts/backup.js"]
    environment:
      DB_FILE: /app/data/app.db
      BACKUP_DIR: /app/backups
      BACKUP_INTERVAL_SECONDS: "86400"
      BACKUP_KEEP: "14"
    volumes:
      - app_data:/app/data:ro
      - app_uploads:/app/private_uploads:ro
      - ./backups:/app/backups
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  internal:
    driver: bridge

volumes:
  app_data:
  app_uploads:
